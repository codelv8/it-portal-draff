/* Responsive record cards: each field remains legible on narrow screens. */
@media(max-width:650px){
 .task-table[data-table="tasks"],.task-table[data-table="tickets"]{display:block;width:100%;min-width:0}
 .task-table[data-table="tasks"] thead,.task-table[data-table="tickets"] thead{display:none}
 .task-table[data-table="tasks"] tbody,.task-table[data-table="tickets"] tbody{display:grid;gap:10px}
 .task-table[data-table="tasks"] tbody tr,.task-table[data-table="tickets"] tbody tr{display:grid;grid-template-columns:1fr 1fr;column-gap:8px;row-gap:8px;background:rgba(255,255,255,.78);border:1px solid #f3e5e6;border-radius:18px;padding:14px;min-width:0}
 .task-table[data-table="tasks"] tbody td,.task-table[data-table="tickets"] tbody td{border:0;padding:0!important;min-width:0;text-align:left;font-size:11px}
 .task-table[data-table="tasks"] tbody td:first-child,.task-table[data-table="tickets"] tbody td:first-child{grid-column:1/-1;padding-bottom:7px!important;border-bottom:1px solid #f4eeee}
 .task-table[data-table="tasks"] tbody td:nth-child(3),.task-table[data-table="tickets"] tbody td:nth-child(3){justify-self:end}
 .task-table[data-table="tasks"] tbody td:nth-child(5),.task-table[data-table="tickets"] tbody td:nth-child(5){justify-self:end}
 .task-table[data-table="tasks"] tbody td:nth-child(6),.task-table[data-table="tickets"] tbody td:nth-child(6){grid-column:1/-1;padding-top:6px!important;border-top:1px solid #f4eeee}
 .task-table[data-table="tasks"] tbody td:nth-child(5)::before{content:'Due: ';font-weight:800;font-size:10px;color:#a08c96}
 .task-table[data-table="tasks"] tbody td:nth-child(6)::before{content:'Progress';display:block;font-size:10px;color:#a08c96;margin-bottom:5px}
 .task-table[data-table="tickets"] tbody td:nth-child(6)::before{content:'SLA / Note · ';font-weight:800;font-size:10px;color:#a08c96}
 .task-table .task-name{font-size:12px;white-space:normal}
}

.nav-label,.metric-label,.metric-foot,.metric-sub,.page-subtitle,.section-sub,

.timeline-pct,.profile-details small,.profile-meta,.task-table th,.task-table td,

.task-table td{font-size:12px}.task-name{font-size:12px}.item-title{font-size:12px}

/* Theme v2 · Aurora Coral Dark — intentional dark mode, not the retired HUD palette.
   Unset data-theme defaults to dark (design-config.json); data-theme="light" restores v1. */
html:not([data-theme="light"]){
  color-scheme:dark;
  --bg:#15131f;--ink:#f7edf5;--ink-soft:#dfd2df;--muted:#c6b7c5;
  --line:rgba(231,212,231,.17);--coral:#ffa0a6;--coral-dark:#ffabb2;
  --coral-soft:rgba(249,126,148,.15);--peach:#f2b7a5;--lavender:#c8b4ec;--mint:#abdfcb;
  --surface:rgba(37,33,51,.80);--surface-strong:rgba(51,44,64,.95);
  --surface-muted:rgba(41,35,55,.67);
  --shadow:0 18px 56px rgba(5,4,15,.43),0 3px 14px rgba(4,3,12,.20);
}
html[data-theme="light"]{color-scheme:light}

 background:radial-gradient(ellipse 47% 52% at 100% 0%,rgba(247,105,133,.20),transparent 84%),

 radial-gradient(ellipse 40% 55% at 8% 82%,rgba(123,98,196,.20),transparent 83%),

}

  <section class="glass card">${section('Workflow preferences','ตัวอย่างการตั้งค่า UX ไม่ได้ส่ง Notification จริง')}<div class="setting-row"><div><strong>Task due reminders</strong><p>เปิด/ปิดมุมมองการแจ้งเตือนกำหนดส่ง</p></div><label class="toggle"><input type="checkbox" data-setting="reminder" ${st.settings.reminder?'checked':''} aria-label="Task reminder"><span class="track"></span></label></div><div class="setting-row"><div><strong>Risk alerts</strong><p>แสดงความเสี่ยงและงานติดปัญหาใน Workspace</p></div><label class="toggle"><input type="checkbox" data-setting="alerts" ${st.settings.alerts?'checked':''} aria-label="Risk alerts"><span class="track"></span></label></div><div class="setting-row"><div><strong>Weekly summary</strong><p>จำลองการเลือกสรุปรายสัปดาห์</p></div><label class="toggle"><input type="checkbox" data-setting="summary" ${st.settings.summary?'checked':''} aria-label="Weekly summary"><span class="track"></span></label></div><div class="surface" style="padding:18px;margin-top:20px"><div class="item-title">Data storage</div><p class="help">รายการที่เพิ่มหรือแก้ไขจะถูกเก็บด้วย localStorage ของเบราว์เซอร์ ไม่ได้ซิงก์ฐานข้อมูล ไม่มี Login/Authentication จริง และไม่เชื่อมต่อ GitHub</p><button class="btn btn-danger btn-sm" data-action="reset-data">${icon('refresh',14)} ล้างการเปลี่ยนแปลง Mock</button></div></section></div>`}
  function taskDetail(){const id=new URLSearchParams(location.search).get('id')||st.tasks[0]?.id;const t=st.tasks.find(x=>x.id===id);if(!t)return `${heading('ไม่พบงาน','กรุณากลับไปหน้ารายการงาน',linkBtn('my-work','กลับไปงานทั้งหมด','btn-primary','arrow'))}`;const p=project(t.project), notes=st.notes[t.id]||[];return `${heading(t.title,`${t.id} · ${esc(t.description)}`,`${linkBtn('my-work','งานทั้งหมด','btn-outline','chevron')} <button class="btn btn-primary" data-action="new-task">${icon('plus',16)} เพิ่มงาน</button>`,'TASK DETAILS')}
  <div class="metrics">${metric('Priority',t.priority,'ระดับความสำคัญ','alert')}${metric('Progress',t.progress+'%','ความคืบหน้าที่รายงาน','activity','orange')}${metric('Effort',t.effort+' ชม.','เวลาบันทึกตัวอย่าง','clock','blue')}${metric('Due Date',fmtDate(t.due),'กำหนดส่งงาน','calendar','mint')}</div><div class="dashboard-grid"><section class="glass card">${section('Task overview','รายละเอียดและสิ่งที่ต้องดำเนินการ')}<div class="surface" style="padding:20px"><div class="flex-row" style="flex-wrap:wrap;margin-bottom:12px">${badge(t.priority)} ${badge(t.status)}<span class="help">${esc(t.category)}</span></div><h2 class="section-title" style="margin-bottom:7px">${esc(t.title)}</h2><p style="font-size:12px" class="task-detail-description">${esc(t.description)}</p><div class="meta-split" style="margin-top:13px"><span>Owner <strong>${esc(user(t.owner).name)}</strong></span><span>Due <strong>${fmtDate(t.due)}</strong></span></div><div style="margin-top:18px">${progLine(t.progress)}</div></div>
  <div class="grid-2" style="margin-top:18px"><div class="field"><label for="taskStatusDetail">ปรับสถานะงาน</label><select id="taskStatusDetail" class="select" data-status-change="${esc(t.id)}">${statuses.map(s=>`<option value="${s}" ${t.status===s?'selected':''}>${esc(statusTH[s])}</option>`).join('')}</select></div><div class="field"><label for="taskProgressDetail">ปรับความคืบหน้า (%)</label><input id="taskProgressDetail" type="number" class="input" min="0" max="100" value="${t.progress}" data-progress-change="${t.id}"></div></div><div style="margin-top:19px">${section('Work logs / Comments','บันทึก Notes ในเบราว์เซอร์สำหรับตัวอย่างนี้')}${notes.map(n=>`<div class="risk-item"><span class="small-icon green">${icon('clipboard',17)}</span><div><div class="item-title">${esc(n.text)}</div><div class="item-sub">${esc(n.at)} · ${esc(n.by)}</div></div></div>`).join('')||'<p class="help">ยังไม่มี Work Log ใหม่ใน Prototype</p>'}<form data-form="note" data-id="${t.id}" style="display:flex;gap:9px;margin-top:16px"><input required class="input" name="note" aria-label="บันทึกความคืบหน้า" placeholder="บันทึกสิ่งที่ดำเนินการ..." style="flex:1;min-width:0"><button class="btn btn-primary btn-sm" type="submit">${icon('send',15)} บันทึก</button></form></div></section>
  <div class="stack"><section class="glass card">${section('Task metadata','ข้อมูลสำหรับตรวจสอบและติดตาม')}<div class="risk-item"><span class="small-icon">${icon('users',17)}</span><div><div class="item-title">Assignee</div><div class="item-sub">${esc(user(t.owner).name)} · ${esc(user(t.owner).team)}</div></div></div><div class="risk-item"><span class="small-icon purple">${icon('folder',17)}</span><div><div class="item-title">Project</div>${p?`<a class="arrow-link" href="${url('project-detail',p.id)}">${esc(p.name)} ${icon('arrow',13)}</a>`:'<div class="item-sub">งานประจำ / ไม่ผูกโครงการ</div>'}</div></div><div class="risk-item"><span class="small-icon green">${icon('clock',17)}</span><div><div class="item-title">Due date</div><div class="item-sub ${isOverdue(t)?'overdue':''}">${fmtDate(t.due)}</div></div></div>${t.blocker?`<div class="surface blocker-note" style="padding:15px;margin-top:12px"><div class="item-title text-bad">Blocker</div><p class="help">${esc(t.blocker)}</p></div>`:''}</section>
  <section class="glass card">${section('Tags & classification','ใช้จัดกลุ่มข้อมูลและค้นหางาน')}<div class="flex-row" style="flex-wrap:wrap">${t.tags.map(x=>`<span class="badge info">${esc(x)}</span>`).join('')}</div><p class="help" style="margin-top:14px">การแก้ไขในหน้านี้ไม่สร้าง Audit Log ที่เชื่อถือได้ เพราะเป็น Frontend Prototype เท่านั้น</p></section></div></div>`}
  function loginPage(){return `<div class="login-wrap"><div class="glass login-panel"><section class="login-art"><div class="flex-row"><div class="brand-symbol">${icon('layers',24)}</div><div style="font-weight:900;font-size:17px">IT Portal<span class="text-coral">.</span></div><div class="spacer"></div>${themeButton()}</div><div class="eyebrow" style="margin-top:65px">THE NEW WAY TO WORK</div><h2>จัดการงาน IT<br>ให้ชัดเจนขึ้นทุกวัน</h2><p>งานประจำ โครงการ KPI และความเสี่ยง ใน Portal เดียวที่พร้อมต่อยอดด้วย Native PHP</p><div style="margin-top:28px" class="badge approved">AURORA CORAL · <span data-theme-label>${theme==='dark'?'Dark':'Light'}</span> MODE</div></section><section class="login-box"><div class="eyebrow">DEMO ENTRY</div><h1>ยินดีต้อนรับ 👋</h1><p>หน้านี้เป็นตัวอย่าง Login UX/UI ยังไม่มีระบบยืนยันตัวตนจริง</p><form data-form="login"><div class="field"><label for="demoRole">Preview Role</label><select class="select" id="demoRole" name="role"><option>IT Lead</option><option>IT Staff</option><option>Executive Viewer</option></select></div><div class="field"><label for="demoEmail">บัญชีผู้ใช้ตัวอย่าง</label><input id="demoEmail" class="input" value="it-demo@hospital.example" disabled></div><button type="submit" class="btn btn-primary w-full" style="margin-top:10px">${icon('arrow',17)} เข้าสู่ Demo Workspace</button></form><div class="login-note">Demo mode เท่านั้น · ไม่มี Password Form, Session, MFA หรือ Backend Authentication</div></section></div></div>`}
  function openModal(content){const lay=document.getElementById('modalLayer');if(!lay)return;lay.innerHTML=`<section class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">${content}</section>`;lay.classList.add('open');document.body.style.overflow='hidden';const first=lay.querySelector('input:not([disabled]),select,textarea,button');first?.focus()}
  function closeModal(){const lay=document.getElementById('modalLayer');if(lay){lay.classList.remove('open');lay.innerHTML=''}document.body.style.overflow=''}
  function modalHeader(title,description=''){return `<div class="modal-head"><div><div class="eyebrow">DEMO INTERACTION</div><h2 id="modalTitle">${esc(title)}</h2>${description?`<p class="help">${esc(description)}</p>`:''}</div><button class="icon-button" data-action="close-modal" aria-label="ปิดกล่องข้อความ">${icon('x',18)}</button></div>`}
  function taskModal(){openModal(`${modalHeader('สร้างงานใหม่','ข้อมูลจะถูกเก็บใน localStorage เท่านั้น')}
    <form data-form="new-task"><div class="form-grid"><div class="field full"><label for="newTaskTitle">ชื่องาน *</label><input class="input" id="newTaskTitle" name="title" required maxlength="130" placeholder="เช่น ตรวจสอบ Server Backup รอบเช้า"></div><div class="field"><label for="newTaskOwner">ผู้รับผิดชอบ</label><select id="newTaskOwner" class="select" name="owner">${M.users.map(u=>`<option value="${u.id}">${esc(u.name)}</option>`).join('')}</select></div><div class="field"><label for="newTaskPriority">Priority</label><select id="newTaskPriority" class="select" name="priority"><option>P1</option><option>P0</option><option>P2</option><option>P3</option></select></div><div class="field"><label for="newTaskProject">โครงการ (Optional)</label><select id="newTaskProject" class="select" name="project"><option value="">งานประจำ / ไม่ผูกโครงการ</option>${M.projects.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select></div><div class="field"><label for="newTaskDate">กำหนดส่ง</label><input id="newTaskDate" class="input" type="date" name="due" value="${M.today}" required></div><div class="field full"><label for="newTaskDesc">รายละเอียดงาน</label><textarea id="newTaskDesc" class="textarea" name="description" maxlength="500" placeholder="รายละเอียด / สิ่งที่ต้องส่งมอบ"></textarea></div></div><div class="modal-actions"><button type="button" class="btn btn-outline" data-action="close-modal">ยกเลิก</button><button type="submit" class="btn btn-primary">${icon('check',15)} สร้างงานจำลอง</button></div></form>`)}
  function ticketModal(){openModal(`${modalHeader('แจ้งรายการใหม่','การสร้าง Ticket ตัวอย่างไม่ส่งเรื่องไปยังทีมจริง')}<form data-form="new-ticket"><div class="form-grid"><div class="field full"><label for="newTicketTitle">หัวข้อเรื่อง *</label><input id="newTicketTitle" class="input" name="title" required maxlength="130" placeholder="ปัญหาหรือความต้องการ"></div><div class="field"><label for="newTicketType">ประเภท</label><select id="newTicketType" class="select" name="type"><option>Incident</option><option>Service Request</option></select></div><div class="field"><label for="newTicketPriority">Priority</label><select id="newTicketPriority" class="select" name="priority"><option>P2</option><option>P0</option><option>P1</option><option>P3</option></select></div><div class="field"><label for="newTicketOwner">ผู้รับผิดชอบ</label><select id="newTicketOwner" name="owner" class="select">${M.users.map(u=>`<option value="${u.id}">${esc(u.name)}</option>`).join('')}</select></div><div class="field"><label for="newTicketRequester">หน่วยงานผู้แจ้ง</label><input id="newTicketRequester" name="requester" class="input" value="หน่วยงานตัวอย่าง"></div></div><div class="modal-actions"><button type="button" class="btn btn-outline" data-action="close-modal">ยกเลิก</button><button class="btn btn-primary" type="submit">${icon('plus',15)} บันทึก Mock Ticket</button></div></form>`)}
  function evidenceModal(){openModal(`${modalHeader('บันทึกหลักฐานจำลอง','หน้าต้นแบบไม่มีการอัปโหลดหรือจัดเก็บไฟล์จริง')}<form data-form="new-evidence"><div class="form-grid"><div class="field full"><label for="evidenceTitle">ชื่อหลักฐาน *</label><input id="evidenceTitle" name="title" class="input" required placeholder="เช่น Restore Test Result (Sample)"></div><div class="field"><label for="evidenceProject">โครงการ</label><select id="evidenceProject" class="select" name="project">${M.projects.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select></div><div class="field"><label for="evidenceKpi">ตัวชี้วัด</label><select id="evidenceKpi" class="select" name="kpi">${M.kpis.map(k=>`<option value="${k.id}">${esc(k.id+' · '+k.label)}</option>`).join('')}</select></div><div class="field full"><label for="evidenceFile">ไฟล์ตัวอย่าง (ชื่อไฟล์เท่านั้น)</label><input id="evidenceFile" type="file" name="file" class="input" accept=".pdf,.xlsx,.docx,.png,.jpg"><div class="help">ไฟล์ที่เลือกจะไม่ถูกอ่าน ส่ง หรือจัดเก็บ เก็บเฉพาะชื่อไฟล์ใน Mock Record</div></div></div><div class="modal-actions"><button type="button" class="btn btn-outline" data-action="close-modal">ยกเลิก</button><button class="btn btn-primary" type="submit">${icon('plus',15)} เพิ่มรายการหลักฐาน</button></div></form>`)}
  function viewEvidence(id){const e=st.evidence.find(x=>x.id===id);if(!e)return;openModal(`${modalHeader(e.title,'Metadata preview · ไม่มีไฟล์ให้ดาวน์โหลด')}<div class="surface" style="padding:18px">${[['Evidence ID',e.id],['Project',project(e.project)?.name||'—'],['KPI',e.kpi],['ผู้ส่งหลักฐาน',user(e.by).name],['วันที่',fmtDate(e.date)],['ชนิดไฟล์',e.type],['ขนาดที่แสดง',e.size]].map(([k,v])=>`<div class="setting-row"><strong>${esc(k)}</strong><span class="help">${esc(v)}</span></div>`).join('')}<div style="margin-top:16px">${badge(e.status)}</div></div><div class="modal-actions"><button class="btn btn-outline" data-action="close-modal">ปิด</button>${e.status==='Pending'?`<button class="btn btn-primary" data-action="approve-evidence" data-id="${e.id}">ตรวจรับจำลอง</button>`:''}</div>`)}
  function viewTicket(id){const t=st.tickets.find(x=>x.id===id);if(!t)return;openModal(`${modalHeader(t.title,'รายละเอียด Ticket จำลอง')}<div class="surface" style="padding:19px"><div class="flex-row" style="margin-bottom:14px">${badge(t.priority)}${badge(t.status)}</div>${[['Ticket ID',t.id],['ประเภท',t.type],['หน่วยงานผู้แจ้ง',t.requester],['ผู้รับผิดชอบ',user(t.owner).name],['วันที่เปิด',fmtDate(t.opened)],['SLA Note',t.sla]].map(([k,v])=>`<div class="setting-row"><strong>${esc(k)}</strong><span class="help">${esc(v)}</span></div>`).join('')}</div><div class="modal-actions"><button class="btn btn-primary" data-action="close-modal">ปิด</button></div>`)}
  function showToast(textMsg,kind=''){const holder=document.getElementById('toastHolder');if(!holder)return;const el=document.createElement('div');el.className='toast '+kind;el.textContent=textMsg;holder.appendChild(el);setTimeout(()=>el.remove(),3400)}
  function setTaskStatus(id,s){const t=st.tasks.find(x=>x.id===id);if(!t||!statuses.includes(s))return;t.status=s;save();render();showToast(`${id}: เปลี่ยนสถานะเป็น ${statusTH[s]} (Mock)`,'good')}
  function addNote(form){const id=form.dataset.id,t=st.tasks.find(x=>x.id===id);const note=form.elements.note.value.trim();if(!t||!note)return;st.notes[id]=st.notes[id]||[];st.notes[id].unshift({text:note,by:'IT Lead (Demo)',at:'25 ต.ค. 2569 · Demo'});save();renderMain();showToast('บันทึก Work Log จำลองแล้ว','good')}
  function csvCell(v){let s=String(v??'');if(/^[=+@\-\t\r]/.test(s))s="'"+s;return '"'+s.replace(/"/g,'""')+'"'}
  function exportCsv(filename,rows){const csv='\uFEFF'+rows.map(r=>r.map(csvCell).join(',')).join('\r\n');const blob=new Blob([csv],{type:'text/csv;charset=utf-8'});const u=URL.createObjectURL(blob);const a=document.createElement('a');a.href=u;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1000);showToast('สร้าง CSV จากข้อมูลจำลองแล้ว','good')}
  function openCommand(){const el=document.getElementById('commandLayer');if(!el)return;el.innerHTML=`<div class="command" role="dialog" aria-modal="true" aria-label="ค้นหา"><div class="flex-row">${icon('search',18)}<input id="commandInput" class="command-input" placeholder="พิมพ์ชื่อหน้า รหัสงาน หรือชื่องาน..." aria-label="ค้นหาเมนูและงาน"><button class="icon-button" data-action="close-command" aria-label="ปิด">${icon('x',16)}</button></div><div class="command-list" id="commandList">${commandResults('')}</div><div class="help" style="padding:10px">คลิกเพื่อเปิดหน้า · Esc เพื่อปิด · Ctrl/Cmd + K เพื่อค้นหา</div></div>`;el.classList.add('open');el.querySelector('input')?.focus()}
  function commandResults(q){const s=q.trim().toLowerCase();const navItems=navigation.flatMap(g=>g.items).filter(([p,label])=>(p+' '+label).toLowerCase().includes(s)).slice(0,8);const ts=st.tasks.filter(t=>(t.title+' '+t.id).toLowerCase().includes(s)).slice(0,6);return navItems.map(([p,label,i])=>`<a class="command-result" href="${url(p)}">${icon(i,17)}${esc(label)}<small>หน้าเมนู</small></a>`).join('')+ts.map(t=>`<a class="command-result" href="${url('task-detail',t.id)}">${icon('check-square',17)}${esc(t.title)}<small>${esc(t.id)}</small></a>`).join('')||'<div class="empty-state">ไม่พบรายการที่ค้นหา</div>'}
  function closeCommand(){const el=document.getElementById('commandLayer');if(el){el.classList.remove('open');el.innerHTML=''}}
  function formSubmit(e){const form=e.target.closest('form[data-form]');if(!form)return;e.preventDefault();const type=form.dataset.form,fd=new FormData(form);
    if(type==='login'){st.role=fd.get('role');save();location.href='index.html';return}
    if(type==='new-task'){const title=String(fd.get('title')||'').trim();if(!title)return;const numbers=st.tasks.map(t=>Number((t.id.match(/IT-(\d+)/)||[])[1])||2400);const id='IT-'+(Math.max(2418,...numbers)+1);st.tasks.unshift({id,title,description:String(fd.get('description')||'').trim(),priority:String(fd.get('priority')),status:'Not Started',owner:String(fd.get('owner')),project:String(fd.get('project')||''),category:fd.get('project')?'Project':'Routine',due:String(fd.get('due')),progress:0,effort:0,tags:['New'],blocker:''});save();closeModal();render();showToast(`สร้างงานตัวอย่าง ${id} แล้ว`,'good');return}
    if(type==='new-ticket'){const title=String(fd.get('title')||'').trim();if(!title)return;const nums=st.tickets.map(t=>Number((t.id.match(/REQ-(\d+)/)||[])[1])||300);const id='REQ-'+(Math.max(306,...nums)+1);st.tickets.unshift({id,title,type:String(fd.get('type')),requester:String(fd.get('requester')||'หน่วยงานตัวอย่าง'),priority:String(fd.get('priority')),status:'Not Started',owner:String(fd.get('owner')),opened:M.today,sla:'ยังไม่ได้กำหนด SLA จริง'});save();closeModal();render();showToast(`สร้าง Ticket จำลอง ${id} แล้ว`,'good');return}
    if(type==='new-evidence'){const title=String(fd.get('title')||'').trim();if(!title)return;const nums=st.evidence.map(x=>Number((x.id.match(/EV-(\d+)/)||[])[1])||100);const file=form.elements.file?.files?.[0];const id='EV-'+(Math.max(106,...nums)+1);const ext=file?.name?.split('.').pop()?.toUpperCase()||'META';st.evidence.unshift({id,title:title+(file?' · '+file.name:''),type:ext,by:'u1',project:String(fd.get('project')),kpi:String(fd.get('kpi')),date:M.today,status:'Draft',size:'metadata only'});save();closeModal();render();showToast('เพิ่ม Metadata หลักฐานจำลองแล้ว ไม่มีการอัปโหลดไฟล์','good');return}
    if(type==='note'){addNote(form);return}
  }
  function actionClick(e){if(e.target.id==='modalLayer'){closeModal();return}if(e.target.id==='commandLayer'){closeCommand();return}
    const b=e.target.closest('[data-action]');if(b){const a=b.dataset.action,id=b.dataset.id;
      if(a==='new-task')taskModal();else if(a==='new-ticket')ticketModal();else if(a==='evidence-guide')evidenceModal();else if(a==='close-modal')closeModal();else if(a==='view-evidence')viewEvidence(id);else if(a==='view-ticket')viewTicket(id);else if(a==='close-command')closeCommand();else if(a==='command')openCommand();else if(a==='toggle-menu'){document.getElementById('sidebar')?.classList.toggle('open');document.getElementById('sidebarBackdrop')?.classList.toggle('open')}else if(a==='toggle-theme'){setTheme(theme==='dark'?'light':'dark');showToast('เปลี่ยนเป็น '+(theme==='dark'?'Dark':'Light')+' Theme แล้ว','good')}
      else if(a==='mark-read'){st.notifications.forEach(n=>n.read=true);save();render();showToast('ทำเครื่องหมายอ่านทั้งหมดแล้ว','good')}
      else if(a==='read-notification'){const n=st.notifications.find(x=>x.id===id);if(n){n.read=true;save();render();showToast('ทำเครื่องหมายอ่านแล้ว','good')}}
      else if(a==='approve-evidence'){const ev=st.evidence.find(x=>x.id===id);if(ev){ev.status='Approved';save();closeModal();render();showToast('ตรวจรับหลักฐานแบบจำลองแล้ว (ไม่ใช่การอนุมัติจริง)','good')}}
      else if(a==='reset-data'){if(confirm('คืนค่าข้อมูลตัวอย่างทั้งหมด? งานและรายการที่ทดลองเพิ่มในเบราว์เซอร์นี้จะถูกลบ')){try{localStorage.removeItem(STORAGE)}catch(err){}st=loadState();render();showToast('คืนค่า Mock Data แล้ว','good')}}
      else if(a==='export-tasks'||a==='export-report'){exportCsv('it-portal-mock-tasks.csv',[['ID','Task','Owner','Priority','Status','Due Date','Progress','Project'],...st.tasks.map(t=>[t.id,t.title,user(t.owner).name,t.priority,t.status,t.due,t.progress,project(t.project)?.name||''])])}
      else if(a==='export-evidence'){exportCsv('it-portal-mock-evidence.csv',[['Evidence ID','Title','Project','KPI','Status','Owner','Date'],...st.evidence.map(x=>[x.id,x.title,x.project,x.kpi,x.status,user(x.by).name,x.date])])}
      else if(a==='print')window.print();return}
    const choice=e.target.closest('[data-theme-choice]');if(choice){setTheme(choice.dataset.themeChoice);return}
    const tab=e.target.closest('[data-scope],[data-quarter],[data-report-type],[data-evidence-filter],[data-framework],[data-ticket-filter],[data-notifs],[data-kpi]');if(tab){if(tab.dataset.scope)view.scope=tab.dataset.scope;else if(tab.dataset.quarter)view.quarter=tab.dataset.quarter;else if(tab.dataset.reportType)view.report=tab.dataset.reportType;else if(tab.dataset.evidenceFilter)view.evidence=tab.dataset.evidenceFilter;else if(tab.dataset.framework)view.framework=tab.dataset.framework;else if(tab.dataset.ticketFilter)view.ticket=tab.dataset.ticketFilter;else if(tab.dataset.notifs)view.notifs=tab.dataset.notifs;else if(tab.dataset.kpi)view.kpi=tab.dataset.kpi;renderMain()}
  }
  function inputChange(e){const t=e.target;if(t.matches('[data-status-change]')){setTaskStatus(t.dataset.statusChange,t.value);return}
    if(t.matches('[data-ticket-status]')){const x=st.tickets.find(x=>x.id===t.dataset.ticketStatus);if(x){x.status=t.value;save();renderMain();showToast('เปลี่ยนสถานะ Ticket จำลองแล้ว','good')}return}
    if(t.matches('[data-progress-change]')){const x=st.tasks.find(x=>x.id===t.dataset.progressChange);if(x){x.progress=Math.min(100,Math.max(0,Number(t.value)||0));save();renderMain();showToast('ปรับความคืบหน้า (Mock) แล้ว','good')}return}
    if(t.matches('[data-role-select]')){st.role=t.value;save();render();showToast(`ทดลองสลับบทบาทเป็น ${t.value} (ยังไม่มี RBAC จริง)`);return}
    if(t.matches('[data-setting]')){st.settings[t.dataset.setting]=t.checked;save();renderMain();showToast('บันทึกการตั้งค่า UX จำลองแล้ว','good');return}
    if(t.matches('[data-filter-priority]')){view.priority=t.value;renderMain();return}
    if(t.matches('[data-filter-status]')){view.status=t.value;renderMain();return}
  }
  function inputTyping(e){const el=e.target;if(el.id==='commandInput'){const list=document.getElementById('commandList');if(list)list.innerHTML=commandResults(el.value);return}if(el.matches('[data-filter-search]')){const value=el.value,start=el.selectionStart;view.search=value;renderMain();const again=document.querySelector('[data-filter-search]');if(again){again.focus();try{again.setSelectionRange(start,start)}catch(e){}}}}
  let dragging='';document.addEventListener('dragstart',e=>{const el=e.target.closest('[data-task-drag]');if(el){dragging=el.dataset.taskDrag;e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain',dragging)}});
  document.addEventListener('dragover',e=>{const col=e.target.closest('[data-status-drop]');if(col){e.preventDefault();col.classList.add('dragover')}});
  document.addEventListener('dragleave',e=>{const col=e.target.closest('[data-status-drop]');if(col&&!col.contains(e.relatedTarget))col.classList.remove('dragover')});
  document.addEventListener('drop',e=>{const col=e.target.closest('[data-status-drop]');if(col){e.preventDefault();const id=dragging||e.dataTransfer.getData('text/plain');dragging='';setTaskStatus(id,col.dataset.statusDrop)}});
  document.addEventListener('click',actionClick);
  document.addEventListener('change',inputChange);
  document.addEventListener('input',inputTyping);
  document.addEventListener('submit',formSubmit);
  document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();document.getElementById('commandLayer')?.classList.contains('open')?closeCommand():openCommand()}if(e.key==='Escape'){closeModal();closeCommand()}});
  render();
})();
</script></body></html>
